<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>$title$</title>
  <style>
    body { margin: 0; background: #fffaf3; color: #38291e; font: 16px/1.85 system-ui, sans-serif; }
    main { max-width: 820px; margin: 32px auto; padding: 24px; }
    h1 { font-size: 30px; line-height: 1.4; }
    h2 { font-size: 21px; margin-top: 32px; }
    a { color: #914300; overflow-wrap: anywhere; }
    blockquote { border-left: 3px solid #b67439; margin: 20px 0; padding: 4px 16px; background: #fff3e5; }
    @media (max-width: 600px) { main { margin: 8px auto; padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>$title$</h1>
    $body$
  </main>
</body>
</html>
